[manager]
prepend_keymap = [
  { on = [ "e" ],         run = "open",                       desc = "Open the selected files" },
	{ on = [ "o" ],         run = "open --interactive",         desc = "Open the selected files interactively" },
  { on = [ "<C-n>"],      run = "shell 'dragon -x -i -T \"$@\"' --confirm" },
]
